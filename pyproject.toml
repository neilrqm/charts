[tool.poetry]
name = "Charts"
version = "0.1.0"
description = "App for charting various data."
authors = ["Neil MacMillan"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
fastapi = ">=0.128.8,<1"
google-api-python-client = ">=2.188.0,<3"
google-auth-httplib2 = ">=0.2.1,<1"
google-auth-oauthlib = ">=1.2.4,<2"
uvicorn = ">=0.40.0,<1"
python = ">=3.13,<3.14"

[tool.poetry.group.dev.dependencies]
black = ">=26.10.1"
flake8 = ">=7.4.1"
flake8-pyproject = ">=1.2.4"
pyright = ">=1.1.414"
types-cachetools = ">=7.0.0.20260713"
pytest = ">=9.1.1"
pytest-coverage = ">=0.0"

[build-system]
requires = ["poetry-core"]

[tool.black]
target-version = ["py312"]
line-length = 100

[tool.flake8]
max-line-length = 100
